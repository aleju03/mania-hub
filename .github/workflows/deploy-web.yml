name: Deploy frontend (dev channel) to VPS

# develop -> ninja.mania-tracker.com ONLY. The apex (mania-tracker.com) is
# deployed from main by deploy-web-prod.yml; pushing develop never touches
# what visitors see. Caddy routes ninja to the single mania-hub-web-ninja
# instance on port 3002, with its own release dir, so the two channels share
# nothing but the .env.
#
# workflow_dispatch is listed but GitHub only surfaces it from the default
# branch, so the push trigger is the live one.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'live-backend/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      restart:
        description: Restart mania-hub-web-ninja after deploying
        type: boolean
        default: true

concurrency:
  group: deploy-web-ninja
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  WEB_DIR: /home/${{ secrets.VPS_USER }}/apps/mania-hub-web-ninja
  # Baked into the browser bundle at build time, so it must be the public
  # origin - never the loopback address the server itself uses.
  VITE_LIVE_BACKEND_URL: https://api.mania-tracker.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Ninja has its own counter, serialized by deploy-web-ninja. Start after
      # the v2.176 fallback previously served on this channel.
      - name: Choose app version
        run: |
          previous=$(ssh "$VPS_USER@$VPS_HOST" "if [ -f '$WEB_DIR/app-version-counter' ]; then cat '$WEB_DIR/app-version-counter'; else printf '176'; fi")
          if [[ ! "$previous" =~ ^[0-9]{1,9}$ ]]; then
            echo "Invalid app version counter"; exit 1
          fi
          next=$((10#$previous + 1))
          echo "APP_VERSION_COUNTER=$next" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=v2.$next" >> "$GITHUB_ENV"

      # `npm run build` already ends in scripts/verify-build-assets.mjs, which
      # fails the build if the output references an asset that is not there.
      - name: Build
        run: npm run build

      - name: Fail early if the server bundle is missing
        run: test -f .output/server/index.mjs || { echo "no .output/server/index.mjs - wrong nitro preset?"; exit 1; }

      # Upload into a per-commit release dir, then flip a symlink. A half-copied
      # release is never the one being served, and the previous one stays on
      # disk so rollback is one symlink swap.
      - name: Upload release
        run: |
          REL="$WEB_DIR/releases/${{ github.sha }}"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$REL'"
          rsync -az --delete .output/ "$VPS_USER@$VPS_HOST:$REL/.output/"

      - name: Activate release
        run: |
          REL="$WEB_DIR/releases/${{ github.sha }}"
          ssh "$VPS_USER@$VPS_HOST" "ln -sfn '$REL' '$WEB_DIR/current.new' && mv -T '$WEB_DIR/current.new' '$WEB_DIR/current'"

      # Single instance: a dev deploy has a ~15s gap while node boots, seen by
      # nobody but the owner. Caddy's lb_try_duration holds requests through it.
      #
      # inputs.* is undefined on a push, which would silently skip this and
      # leave the old release running against a freshly flipped symlink.
      - name: Restart
        if: github.event_name != 'workflow_dispatch' || inputs.restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            echo "restarting mania-hub-web-ninja"
            sudo -n systemctl restart mania-hub-web-ninja
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: ninja.mania-tracker.com" "http://127.0.0.1:3002/" || true)
              if [ "$code" = "200" ]; then echo "  port 3002 ready after ${i}s"; exit 0; fi
              sleep 1
            done
            echo "  port 3002 never returned 200 (last: $code)"
            sudo -n systemctl --no-pager -n 40 status mania-hub-web-ninja || true
            exit 1
          '

      # Through Caddy this time, not the loopback port: catches a config or
      # TLS problem that a direct-to-node check would sail straight past.
      # ninja only - the apex belongs to deploy-web-prod.yml.
      - name: Health check via Caddy
        if: github.event_name != 'workflow_dispatch' || inputs.restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            code=$(curl -s -o /dev/null -w "%{http_code}" --resolve "ninja.mania-tracker.com:443:127.0.0.1" "https://ninja.mania-tracker.com/" || true)
            if [ "$code" != "200" ]; then echo "ninja.mania-tracker.com returned $code"; exit 1; fi
            echo "  ninja.mania-tracker.com ok"
          '

      # Consume the number only after a successful deployment, including a
      # manual upload with restart disabled, matching the production workflow.
      - name: Record successful app version
        run: |
          ssh "$VPS_USER@$VPS_HOST" "printf '%s\n' '$APP_VERSION_COUNTER' > '$WEB_DIR/app-version-counter.new' && mv '$WEB_DIR/app-version-counter.new' '$WEB_DIR/app-version-counter'"

      # Keep the 3 newest releases; older ones are just disk. Never touches
      # whatever `current` points at.
      #
      # Not if: always() - an early failure (a bad lockfile, say) means the SSH
      # step never ran, so this just fails again with "Host key verification
      # failed" and buries the real error under a second one.
      - name: Prune old releases
        if: success()
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            cd '"$WEB_DIR"'/releases || exit 0
            keep=$(basename "$(readlink -f '"$WEB_DIR"'/current)")
            ls -1dt */ 2>/dev/null | tail -n +4 | sed "s#/##" | while read -r d; do
              [ "$d" = "$keep" ] && continue
              rm -rf -- "$d"
            done
          '
