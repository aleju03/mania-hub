name: Deploy frontend (prod) to VPS

# main -> mania-tracker.com. This is the release lane: fast-forwarding main is
# now the act of shipping to visitors, so main only moves deliberately. The
# dev channel (develop -> ninja.mania-tracker.com) lives in deploy-web.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'live-backend/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      restart:
        description: Restart mania-hub-web after deploying
        type: boolean
        default: true

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  WEB_DIR: /home/${{ secrets.VPS_USER }}/apps/mania-hub-web
  # Baked into the browser bundle at build time, so it must be the public
  # origin - never the loopback address the server itself uses.
  VITE_LIVE_BACKEND_URL: https://api.mania-tracker.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` already ends in scripts/verify-build-assets.mjs, which
      # fails the build if the output references an asset that is not there.
      - name: Build
        run: npm run build

      - name: Fail early if the server bundle is missing
        run: test -f .output/server/index.mjs || { echo "no .output/server/index.mjs - wrong nitro preset?"; exit 1; }

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Upload into a per-commit release dir, then flip a symlink. A half-copied
      # release is never the one being served, and the previous one stays on
      # disk so rollback is one symlink swap.
      - name: Upload release
        run: |
          REL="$WEB_DIR/releases/${{ github.sha }}"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$REL'"
          rsync -az --delete .output/ "$VPS_USER@$VPS_HOST:$REL/.output/"

      - name: Activate release
        run: |
          REL="$WEB_DIR/releases/${{ github.sha }}"
          ssh "$VPS_USER@$VPS_HOST" "ln -sfn '$REL' '$WEB_DIR/current.new' && mv -T '$WEB_DIR/current.new' '$WEB_DIR/current'"

      # Rolling restart, one instance at a time. Caddy load-balances 3000 and
      # 3001, so waiting for each to serve before touching the next means there
      # is always a live upstream and visitors never see the gap. Restarting
      # both at once would drop every request for the ~15s node takes to boot
      # on this box, which is what used to surface as a 502 mid-deploy.
      #
      # inputs.* is undefined on a push, which would silently skip this and
      # leave the old release running against a freshly flipped symlink.
      - name: Rolling restart
        if: github.event_name != 'workflow_dispatch' || inputs.restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            wait_ready() {
              for i in $(seq 1 90); do
                code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: mania-tracker.com" "http://127.0.0.1:$1/" || true)
                if [ "$code" = "200" ]; then echo "  port $1 ready after ${i}s"; return 0; fi
                sleep 1
              done
              echo "  port $1 never returned 200 (last: $code)"
              systemctl --no-pager -n 40 status "mania-hub-web@$1" || true
              return 1
            }
            for port in 3000 3001; do
              echo "restarting mania-hub-web@$port"
              sudo -n systemctl restart "mania-hub-web@$port"
              wait_ready "$port"
            done
          '

      # Through Caddy this time, not the loopback ports: catches a config or
      # TLS problem that a direct-to-node check would sail straight past.
      # Apex + www redirect only - ninja belongs to deploy-web.yml.
      - name: Health check via Caddy
        if: github.event_name != 'workflow_dispatch' || inputs.restart
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            code=$(curl -s -o /dev/null -w "%{http_code}" --resolve "mania-tracker.com:443:127.0.0.1" "https://mania-tracker.com/" || true)
            if [ "$code" != "200" ]; then echo "mania-tracker.com returned $code"; exit 1; fi
            echo "  mania-tracker.com ok"
          '

      # Keep the 3 newest releases; older ones are just disk. Never touches
      # whatever `current` points at.
      #
      # Not if: always() - an early failure (a bad lockfile, say) means the SSH
      # step never ran, so this just fails again with "Host key verification
      # failed" and buries the real error under a second one.
      - name: Prune old releases
        if: success()
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            cd '"$WEB_DIR"'/releases || exit 0
            keep=$(basename "$(readlink -f '"$WEB_DIR"'/current)")
            ls -1dt */ 2>/dev/null | tail -n +4 | sed "s#/##" | while read -r d; do
              [ "$d" = "$keep" ] && continue
              rm -rf -- "$d"
            done
          '
