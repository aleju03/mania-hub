# Drop-in for mania-hub-live-server.service: pull the listen socket into
# every (re)start transaction. Wants= (not Requires=) on purpose - if the
# socket ever fails to bind, the service still starts and binds the port
# itself (the code falls back when LISTEN_FDS is absent), which is exactly
# today's behavior. systemd orders the socket Before= its service
# automatically, so within one restart the old process exits, the socket
# binds the freed port, and the new process inherits it.
[Unit]
Wants=mania-hub-live-server.socket
After=mania-hub-live-server.socket
